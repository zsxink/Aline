[workspace]
resolver = "3"
members = [
    "app",
    "crates/aline-app-core",
    "crates/aline-source",
    "crates/aline-buffer",
    "crates/aline-markdown",
    "crates/aline-edit",
    "crates/aline-plugin",
    "crates/aline-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
aline-app-core = { path = "crates/aline-app-core" }
aline-source = { path = "crates/aline-source" }
aline-buffer = { path = "crates/aline-buffer" }
aline-markdown = { path = "crates/aline-markdown" }
aline-edit = { path = "crates/aline-edit" }
aline-plugin = { path = "crates/aline-plugin" }
aline-ui = { path = "crates/aline-ui" }
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false }
gpui_macos = { package = "gpui-pre-macos", version = "=0.3.9", default-features = false, features = ["font-kit"] }
sys_locale = { package = "sys-locale", version = "=0.3.2", default-features = false }
pulldown-cmark = { version = "=0.13.6", default-features = false }
unicode-segmentation = "=1.13.3"
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse", "serde"] }
rust-embed = { version = "=8.13.0", default-features = false, features = ["debug-embed"] }

# 已准入的本地来源：crates.io 发布包 + 已审查的中文避头尾补丁。
# 字节身份由 scripts/engineering_policy.json 的 native_backend.core（tree_sha256 +
# files）与 scripts/dependency_admission_policy.json 的 license.local_paths
# 在每次门禁运行时重新核对；来源与补丁证据见 vendor/PROVENANCE.json。
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre-0.3.9" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
