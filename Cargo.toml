[workspace]
resolver = "3"
members = [
    "app",
    "crates/aline-app-core",
    "crates/aline-source",
    "crates/aline-buffer",
    "crates/aline-markdown",
    "crates/aline-edit",
    "crates/aline-plugin",
    "crates/aline-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
aline-app-core = { path = "crates/aline-app-core" }
aline-source = { path = "crates/aline-source" }
aline-buffer = { path = "crates/aline-buffer" }
aline-markdown = { path = "crates/aline-markdown" }
aline-edit = { path = "crates/aline-edit" }
aline-plugin = { path = "crates/aline-plugin" }
aline-ui = { path = "crates/aline-ui" }
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false }
pulldown-cmark = { version = "=0.13.6", default-features = false }
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse", "serde"] }
rust-embed = { version = "=8.13.0", default-features = false, features = ["debug-embed"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
