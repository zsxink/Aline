[package]
name = "aline-source"
version.workspace = true
edition.workspace = true
publish.workspace = true

# 本成员不能同时继承 workspace lints 再覆盖单条 lint（Cargo 1.98.1 实测拒绝），
# 因此逐条镜像根清单并只把 unsafe_code 放宽为 deny：2026-11-18 用户准入「最小
# 自包含 FFI」（记录见 docs/decisions.md §44）。只有
# src/atomic/platform/macos.rs 带文件级 `#![allow(unsafe_code)]`；其余文件出现
# `unsafe` 在普通 cargo build 也因 deny 而失败；scripts/check_safety.py 的
# unsafe-owned 规则也只放行该文件。
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
