[workspace]
resolver = "3"
members = ["lint-fixture"]
[workspace.package]
edition = "2024"
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
[workspace.lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
