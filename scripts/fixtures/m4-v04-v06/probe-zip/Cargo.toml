[package]
name = "m4-v04-zip"
version = "0.1.0"
edition = "2021"
publish = false

# 独立 workspace：同 probe-limits 的理由。
[workspace]

# 候选解包库。主题包格式要求“ZIP64 是否支持由 V-04 的解包库及计数溢出实验
# 决定”，所以这里量的是这个库的实际行为，不是文档承诺。准入裁决在任务 1.5。
[dependencies]
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
serde_json = "1"
